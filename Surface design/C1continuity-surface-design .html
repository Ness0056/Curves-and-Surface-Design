 <html>
<head>
<title>DCS - Problem 2</title>
</head>

<body>
<h1>DCS - Lab 5 - Problem 2</h1>

<script src="math.min.js"></script>
<script src="three.min.js"></script>
<script src="OrbitControlsDCS.js"></script>

<script>
    // setup canvas 
var windowWidth = 900, windowHeight = 650;
var scene = new THREE.Scene();

var camera = new THREE.PerspectiveCamera(45, windowWidth/windowHeight, 0.1, 1000);
camera.position.set(55, 45, 70);
camera.lookAt(new THREE.Vector3(0,0,0));

var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(windowWidth, windowHeight);
document.body.appendChild(renderer.domElement);

var spotLight = new THREE.SpotLight(0xffffff);
spotLight.position.copy(camera.position);
scene.add(spotLight);

scene.add(new THREE.AmbientLight(0x555555));
//bezier first with bernstein polynomials as always 
function B(i,t){
    if(i == 0) return Math.pow(1-t,3);
    if(i == 1) return 3*t*Math.pow(1-t,2);
    if(i == 2) return 3*t*t*(1-t);
    if(i == 3) return Math.pow(t,3);
}

function cubicBezier(points, t){ // I used a cubic Bezier to define wach gutter profile alone
    var y = 0, z = 0;

    for(var i = 0; i < 4; i++){
        var b = B(i,t);
        y += b * points[i][0];
        z += b * points[i][1];
    }

    return {y:y, z:z};
}

// given profiles
var P = [
    [-1.5, 2],
    [-1.3, 0],
    [ 1.3, 0],
    [ 1.5, 2]
];

var Q = [
    [-3, 3],
    [-2,-1],
    [ 2,-1],
    [ 3, 3]
];
// just scaling 
var scale = 6;
// the smaller grid start adn end 
var thinStart = -9 * scale;
var thinEnd   = -3 * scale;
// bigger grid start and end 
var bigStart  =  2 * scale;
var bigEnd    =  8 * scale;

// thin gutter
function thinGutter(u,v){
    var p = cubicBezier(P,u); // kinda sweeping the profile p along the x axis 
    var x = thinStart + 6 * scale * v;
    return new THREE.Vector3(x, p.z * scale, p.y * scale);
}

// large gutter and same here 
function bigGutter(u,v){
    var q = cubicBezier(Q,u);
    var x = bigStart + 6 * scale * v;
    return new THREE.Vector3(x, q.z * scale, q.y * scale);
}

// connecting Bézier surface control points
var C = [];

for(var i = 0; i < 4; i++){
    C[i] = [];

    // boundary on thin gutter aka start from the end of the thin gutter
    C[i][0] = new THREE.Vector3(
        thinEnd,
        P[i][1] * scale,
        P[i][0] * scale
    );

    // C1 handle from thin gutter direction 
    C[i][1] = new THREE.Vector3( // controls the tangeant leaving the boundry 
        thinEnd + (bigStart - thinEnd) / 3, //insures continuity  
        P[i][1] * scale,
        P[i][0] * scale
    );

    // C1 handle toward large gutter direction
    C[i][2] = new THREE.Vector3( // controls the tangeant approaching the end 
        bigStart - (bigStart - thinEnd) / 3,
        Q[i][1] * scale,
        Q[i][0] * scale
    );
//To obtain C1 continuity, I placed the inner Bézier control points along the direction between the two gutters. 
// These inner control points define the first derivative/tangent of the connector surface at the boundaries.
    // boundary on large gutter
    C[i][3] = new THREE.Vector3(
        bigStart,
        Q[i][1] * scale,
        Q[i][0] * scale
    );
}
//conector bezier the actual tensor-product Bezier surface formula
function connector(u,v){
    var x = 0, y = 0, z = 0;

    for(var i = 0; i < 4; i++){
        for(var j = 0; j < 4; j++){
            var b = B(i,u) * B(j,v);
            x += b * C[i][j].x;
            y += b * C[i][j].y;
            z += b * C[i][j].z;
        }
    }

    return new THREE.Vector3(x,y,z);
}
// turn everything 3D 
function makeMesh(func, color){
    var geom = new THREE.ParametricGeometry(func, 40, 40);
    var mat = new THREE.MeshLambertMaterial({
        color: color,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
    });
    return new THREE.Mesh(geom, mat);
}
//adding th gutters to the canvas
scene.add(makeMesh(thinGutter, 0x7744cc));
scene.add(makeMesh(bigGutter, 0x7744cc));
scene.add(makeMesh(connector, 0xff5555));

// control polygon for connector
var lineMat = new THREE.LineBasicMaterial({color:0x000000});

for(var i = 0; i < 4; i++){
    var g1 = new THREE.Geometry();
    var g2 = new THREE.Geometry();

    for(var j = 0; j < 4; j++){
        g1.vertices.push(C[i][j]);
        g2.vertices.push(C[j][i]);
    }

    scene.add(new THREE.Line(g1,lineMat));
    scene.add(new THREE.Line(g2,lineMat));
}

// grid + axes
var grid = new THREE.GridHelper(120, 12);
scene.add(grid);

var axes = new THREE.AxisHelper(60);
scene.add(axes);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableZoom = true;

function render(){
    requestAnimationFrame(render);
    spotLight.position.copy(camera.position);
    renderer.render(scene,camera);
}

render();
</script>

<br>
Problem 2: two fixed gutter surfaces connected with a cubic Bézier surface using C1-continuity.
</body>
</html>
